name: ⭐ Proponi una funzione
description: Suggerisci un modo per migliorare AniTenshi
labels: [Feature request]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Descrivi la funzione
      description: Come potrebbe migliorare AniTenshi?
      placeholder: |
        Esempio:
          "Dovrebbe funzionare così..."
    validations:
      required: true

  - type: textarea
    id: other-details
    attributes:
      label: Altri dettagli
      placeholder: |
        Altre informazioni, esempi o allegati.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Conferme
      description: Leggi con attenzione, le richieste incomplete vengono chiuse.
      options:
        - label: Ho cercato tra le issue esistenti e questa è una richiesta nuova, **non** un duplicato.
          required: true
        - label: Ho scritto un titolo breve ma chiaro.
          required: true
        - label: La richiesta non riguarda una singola estensione (in quel caso va fatta a chi la mantiene).
          required: true
        - label: Uso l'**[ultima versione di AniTenshi](https://github.com/Borelli99/AniTenshi/releases/latest)**.
          required: true
