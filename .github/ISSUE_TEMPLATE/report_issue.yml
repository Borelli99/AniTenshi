name: 🐞 Segnala un problema
description: Segnala un problema di AniTenshi
labels: [Bug]
body:
  - type: textarea
    id: reproduce-steps
    attributes:
      label: Passaggi per riprodurlo
      description: Descrivi cosa fare per far comparire il problema.
      placeholder: |
        Esempio:
          1. Primo passaggio
          2. Secondo passaggio
          3. Qui compare il problema
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Cosa ti aspettavi
      description: Spiega cosa dovrebbe succedere.
      placeholder: |
        Esempio:
          "Dovrebbe succedere questo..."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Cosa succede invece
      description: Spiega cosa succede davvero.
      placeholder: |
        Esempio:
          "Invece succede questo..."
    validations:
      required: true

  - type: textarea
    id: crash-logs
    attributes:
      label: Registro dei crash
      description: |
        Se l'app si chiude da sola, vai in **Altro → Impostazioni → Avanzate**, tocca **Condividi il registro dei crash** e allegalo qui.
      placeholder: |
        Puoi allegare il file oppure incollarne il testo.

  - type: input
    id: anitenshi-version
    attributes:
      label: Versione di AniTenshi
      description: La trovi in **Altro → Info**.
      placeholder: |
        Esempio: "0.21.2.0"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Versione di Android
      description: La trovi nelle impostazioni del telefono, di solito in "Info sul telefono".
      placeholder: |
        Esempio: "Android 14"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Dispositivo
      description: Marca e modello del telefono o del tablet.
      placeholder: |
        Esempio: "Samsung Galaxy S23"
    validations:
      required: true

  - type: textarea
    id: other-details
    attributes:
      label: Altri dettagli
      placeholder: |
        Altre informazioni, screenshot o allegati.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Conferme
      description: Leggi con attenzione, le segnalazioni incomplete vengono chiuse.
      options:
        - label: Ho cercato tra le issue esistenti e questa è una segnalazione nuova, **non** un duplicato.
          required: true
        - label: Ho scritto un titolo breve ma chiaro.
          required: true
        - label: Il problema non riguarda una singola estensione (in quel caso va segnalato a chi la mantiene).
          required: true
        - label: Uso l'**[ultima versione di AniTenshi](https://github.com/Borelli99/AniTenshi/releases/latest)**.
          required: true
        - label: Ho compilato tutte le informazioni richieste, compresi i numeri di versione.
          required: true
