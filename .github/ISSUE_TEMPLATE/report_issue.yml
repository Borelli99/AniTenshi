name: 🐞 Issue report
description: Report an issue in AniTenshi
labels: [Bug]
body:
  - type: textarea
    id: reproduce-steps
    attributes:
      label: Steps to reproduce
      description: Provide an example of the issue.
      placeholder: |
        Example:
          1. First step
          2. Second step
          3. Issue here
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: Explain what you should expect to happen.
      placeholder: |
        Example:
          "This should happen..."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: Explain what actually happens.
      placeholder: |
        Example:
          "This happened instead..."
    validations:
      required: true

  - type: textarea
    id: crash-logs
    attributes:
      label: Crash logs
      description: |
        If the app crashes, go to **More → Settings → Advanced**, tap **Share crash logs** and attach them here.
      placeholder: |
        You can upload the crash log file as an attachment, or paste the crash logs in plain text.

  - type: input
    id: anitenshi-version
    attributes:
      label: AniTenshi version
      description: You can find it in **More → About**.
      placeholder: |
        Example: "AniTenshi r9150"
    validations:
      required: true

  - type: input
    id: android-version
    attributes:
      label: Android version
      description: You can find this in your Android settings, usually under "About phone".
      placeholder: |
        Example: "Android 14"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      description: Your device's brand and model.
      placeholder: |
        Example: "Samsung Galaxy S23"
    validations:
      required: true

  - type: textarea
    id: other-details
    attributes:
      label: Other details
      placeholder: |
        Additional details, screenshots and attachments.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Read this carefully, incomplete reports will be closed.
      options:
        - label: I have searched the existing issues and this is a new ticket, **NOT** a duplicate or related to another open or closed issue.
          required: true
        - label: I have written a short but informative title.
          required: true
        - label: This is not an issue with a single extension (those should be reported to the extension's maintainers).
          required: true
        - label: I am using the **[latest version of AniTenshi](https://github.com/Borelli99/AniTenshi/releases/latest)**.
          required: true
        - label: I have filled out all of the requested information in this form, including specific version numbers.
          required: true
