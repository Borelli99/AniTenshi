name: Build AniTenshi APK

# Builds a signed APK of AniTenshi (fork of Animetail) and publishes it as a GitHub release,
# so it can be downloaded straight from the phone (Releases page).
# Pushes to test/** branches build the same signed APK as a public pre-release instead, always under
# the tag "beta" (one at a time, title "AniTenshi <version> beta (r<number>)"): the app offers it only
# to whoever turned on Settings > Info > Beta tester. Once master has a stable release with the same or
# a higher number, the beta is removed.
on:
  push:
    branches:
      - master
      - 'test/**'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and release
    if: github.repository != 'Animetailapp/Animetail'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test extension store decoding and episode dates
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests "mihon.data.extension.model.AnimeExtensionStoreDecoderTest"
          --tests "eu.kanade.tachiyomi.util.EpisodeAirDatesApiTest"
          --tests "eu.kanade.domain.items.SourceDateTest"

      - name: Build app
        # The in-app updater checks this repository's latest release.
        run: ./gradlew assembleRelease -Penable-updater

      - name: Sign APKs
        env:
          # The release keystore lives only in the KEYSTORE_BASE64 repository secret,
          # so every build is signed with the same key and installs as an update.
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: anitenshi
        run: |
          set -euo pipefail
          KEYSTORE="${RUNNER_TEMP}/anitenshi.p12"
          printf '%s' "${KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > "${KEYSTORE}"

          BUILD_TOOLS="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)"
          APKSIGNER="${BUILD_TOOLS}/apksigner"
          ZIPALIGN="${BUILD_TOOLS}/zipalign"
          OUT=signed
          mkdir -p "${OUT}"
          for abi in universal arm64-v8a armeabi-v7a; do
            UNSIGNED="app/build/outputs/apk/release/app-${abi}-release-unsigned.apk"
            if ! "${ZIPALIGN}" -c -P 16 4 "${UNSIGNED}" > /dev/null; then
              "${ZIPALIGN}" -f -P 16 4 "${UNSIGNED}" "${RUNNER_TEMP}/aligned.apk"
              mv "${RUNNER_TEMP}/aligned.apk" "${UNSIGNED}"
            fi
            "${APKSIGNER}" sign \
              --ks "${KEYSTORE}" \
              --ks-type PKCS12 \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias anitenshi \
              --out "${OUT}/anitenshi-${abi}.apk" \
              "${UNSIGNED}"
            "${APKSIGNER}" verify "${OUT}/anitenshi-${abi}.apk"
          done

          # Google Drive sign-in: Google recognises the app by its package name and this certificate's SHA-1
          # (the "Android" OAuth client of the AniTenshi Google Cloud project). No Google key is in the build.
          # A different fingerprint here means Drive sign-in stops working until the client is updated.
          EXPECTED_SHA1="17b684214bd95a7a8699477f830c16c9f2b5c8b9"
          CERTS="$("${APKSIGNER}" verify --print-certs "${OUT}/anitenshi-universal.apk" | grep -i "SHA-1 digest" || true)"
          echo "${CERTS}"
          if echo "${CERTS}" | grep -qi "${EXPECTED_SHA1}"; then
            echo "Google Drive: signing certificate matches the one registered with Google" >> "${GITHUB_STEP_SUMMARY}"
          else
            echo "::warning::Signing certificate SHA-1 is not ${EXPECTED_SHA1}: Google Drive sign-in will not work"
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: anitenshi-${{ github.sha }}
          path: signed/*.apk

      # Turns crash logs from the app ("r8-map-id-…" lines) back into the real code lines
      - name: Upload R8 mapping
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_TEST: ${{ github.ref != 'refs/heads/master' }}
        run: |
          set -euo pipefail
          # Tag = commit count, the same number the app compares against (BuildConfig.COMMIT_COUNT).
          TAG="r$(git rev-list --count HEAD)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          # Version name from app/build.gradle.kts (e.g. 1.0.1); the tag stays r<commit count> for the in-app updater
          VERSION_NAME="$(grep -m1 -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"

          PREVIOUS_TAG="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          # Readable notes for this version (English, since 1.0.17), shown by the in-app updater above the "---" line.
          # Used only when its first line names this version, so stale notes never reach a new release.
          NOTES_FILE=".github/release-notes.md"
          {
            if [ -f "${NOTES_FILE}" ] && head -n1 "${NOTES_FILE}" | grep -qF "${VERSION_NAME}"; then
              cat "${NOTES_FILE}"
              echo
              echo "---"
              echo
            fi
            echo "AniTenshi ${VERSION_NAME} (${TAG}), built from ${SHORT_SHA}."
            echo
            if [ -n "${PREVIOUS_TAG}" ] && [ "${PREVIOUS_TAG}" != "${TAG}" ] && git rev-parse -q --verify "refs/tags/${PREVIOUS_TAG}" > /dev/null; then
              echo "### Changes since ${PREVIOUS_TAG}"
              git log --no-merges -n 40 --pretty='- %s' "${PREVIOUS_TAG}..HEAD"
              echo
            fi
            echo "### Download"
            echo "- \`anitenshi-arm64-v8a.apk\`: most phones"
            echo "- \`anitenshi-universal.apk\`: any device, larger download"
            echo "- \`anitenshi-armeabi-v7a.apk\`: older 32-bit phones"
            echo
            echo "### Support AniTenshi"
            echo "[Buy Me a Coffee](https://buymeacoffee.com/anitenshi) · [PayPal](https://paypal.me/Borelli99)"
          } > "${RUNNER_TEMP}/notes.md"

          REPO="${{ github.repository }}"
          CURRENT="${TAG#r}"
          BETA_TAG="beta"
          # Commit a release's tag points at (empty when the tag doesn't exist).
          tag_sha() { gh api "repos/${REPO}/git/ref/tags/$1" --jq .object.sha 2>/dev/null || true; }
          # Betas with a lower number than this build are superseded by it.
          remove_older_betas() {
            gh api "repos/${REPO}/releases?per_page=100" \
              --jq '.[] | select(.prerelease and (.draft | not) and (.tag_name | test("^r[0-9]+$"))) | .tag_name' |
              while read -r OLD_TAG; do
                if [ "${OLD_TAG#r}" -lt "${CURRENT}" ]; then
                  gh release delete "${OLD_TAG}" --yes --cleanup-tag
                fi
              done
          }
          create_stable() {
            gh release create "${TAG}" signed/*.apk \
              --target "${{ github.sha }}" \
              --title "AniTenshi ${VERSION_NAME} (${TAG})" \
              --notes-file "${RUNNER_TEMP}/notes.md" \
              --latest
          }

          # Build number in the title of the rolling "beta" pre-release (empty when there is none).
          beta_number() {
            gh release view "${BETA_TAG}" --json name --jq .name 2>/dev/null | grep -oP '\(r\K[0-9]+(?=\))' || true
          }

          if [ "${IS_TEST}" = "true" ]; then
            # Private test drafts from before betas went public are no longer used.
            gh api "repos/${REPO}/releases?per_page=100" \
              --jq '.[] | select(.draft and (.tag_name | startswith("test-"))) | .id' |
              while read -r OLD_ID; do gh api -X DELETE "repos/${REPO}/releases/${OLD_ID}"; done
            # Betas tagged r<number> (the first scheme) give way to the single "beta" release.
            gh api "repos/${REPO}/releases?per_page=100" \
              --jq '.[] | select(.prerelease and (.draft | not) and (.tag_name | test("^r[0-9]+$"))) | .tag_name' |
              while read -r OLD_TAG; do gh release delete "${OLD_TAG}" --yes --cleanup-tag; done
            {
              echo "**Beta** (branch \`${GITHUB_REF_NAME}\`): a test version for beta testers (Settings › Info › Beta tester). When it's published as stable, beta testers already have it."
              echo
              cat "${RUNNER_TEMP}/notes.md"
            } > "${RUNNER_TEMP}/beta-notes.md"
            # One beta at a time, always under the tag "beta": the app reads it like releases/latest.
            if gh release view "${BETA_TAG}" > /dev/null 2>&1; then
              if [ "$(tag_sha "${BETA_TAG}")" = "${{ github.sha }}" ]; then
                # The same commit built again: only the files are refreshed.
                gh release upload "${BETA_TAG}" signed/*.apk --clobber
                exit 0
              fi
              gh release delete "${BETA_TAG}" --yes --cleanup-tag
            fi
            gh release create "${BETA_TAG}" signed/*.apk \
              --prerelease --latest=false \
              --target "${{ github.sha }}" \
              --title "AniTenshi ${VERSION_NAME} beta (${TAG})" \
              --notes-file "${RUNNER_TEMP}/beta-notes.md"
          else
            if gh release view "${TAG}" > /dev/null 2>&1; then
              IS_PRE="$(gh release view "${TAG}" --json isPrerelease --jq .isPrerelease)"
              EXISTING_SHA="$(tag_sha "${TAG}")"
              if [ "${IS_PRE}" = "true" ] && [ "${EXISTING_SHA}" = "${{ github.sha }}" ]; then
                # The beta of this same commit becomes the stable release.
                gh release upload "${TAG}" signed/*.apk --clobber
                gh release edit "${TAG}" \
                  --prerelease=false --latest \
                  --title "AniTenshi ${VERSION_NAME} (${TAG})" \
                  --notes-file "${RUNNER_TEMP}/notes.md"
              elif [ "${IS_PRE}" = "true" ]; then
                # A beta of another commit with the same number gives way to the stable release.
                gh release delete "${TAG}" --yes --cleanup-tag
                create_stable
              else
                gh release upload "${TAG}" signed/*.apk --clobber
              fi
            else
              create_stable
            fi
            remove_older_betas
            # The beta is superseded once a stable release has the same or a higher number.
            NUMBER="$(beta_number)"
            if [ -n "${NUMBER}" ] && [ "${NUMBER}" -le "${CURRENT}" ]; then
              gh release delete "${BETA_TAG}" --yes --cleanup-tag
            fi
          fi
