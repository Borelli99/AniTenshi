name: Build AniTenshi APK

# Builds a signed APK of AniTenshi (fork of Animetail) and publishes it as a GitHub release,
# so it can be downloaded straight from the phone (Releases page).
# Pushes to test/** branches build the same signed APK as a private draft release instead
# (visible only to repo owners/collaborators, never offered to the app's updater).
on:
  push:
    branches:
      - master
      - 'test/**'
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and release
    if: github.repository != 'Animetailapp/Animetail'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test extension store decoding and episode dates
        run: >-
          ./gradlew :app:testDebugUnitTest
          --tests "mihon.data.extension.model.AnimeExtensionStoreDecoderTest"
          --tests "eu.kanade.tachiyomi.util.EpisodeAirDatesApiTest"
          --tests "eu.kanade.domain.items.SourceDateTest"

      # Google Drive sync: the app's Google key, a "Desktop app" OAuth client of the AniTenshi Google Cloud
      # project. It isn't in the source code: it comes from repository secrets, either the two values
      # GOOGLE_CLIENT_ID + GOOGLE_CLIENT_SECRET or the downloaded JSON as GOOGLE_CLIENT_SECRETS.
      # Without them Google Drive sign-in just says it isn't set up.
      - name: Add Google Drive key
        env:
          GOOGLE_CLIENT_SECRETS: ${{ secrets.GOOGLE_CLIENT_SECRETS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os
          path = "app/src/main/assets/client_secrets.json"
          raw = os.environ.get("GOOGLE_CLIENT_SECRETS", "").strip()
          cid = os.environ.get("GOOGLE_CLIENT_ID", "").strip()
          secret = os.environ.get("GOOGLE_CLIENT_SECRET", "").strip()
          if raw:
              data = json.loads(raw)
          elif cid and secret:
              data = {"installed": {
                  "client_id": cid,
                  "client_secret": secret,
                  "auth_uri": "https://accounts.google.com/o/oauth2/auth",
                  "token_uri": "https://oauth2.googleapis.com/token",
                  "auth_provider_x509_cert_url": "https://www.googleapis.com/oauth2/v1/certs",
                  "redirect_uris": ["http://localhost"],
              }}
          else:
              print("No Google key secrets: Google Drive stays off in this build")
              raise SystemExit(0)
          client = data.get("installed") or {}
          assert client.get("client_id", "").endswith(".apps.googleusercontent.com"), "client ID looks wrong"
          assert client.get("client_secret"), "not a Desktop app OAuth client (no client secret)"
          with open(path, "w") as f:
              json.dump(data, f)
          print("Google Drive key added")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write("Google Drive: key added to this build\n")
          PY

      - name: Build app
        # The in-app updater checks this repository's latest release.
        run: ./gradlew assembleRelease -Penable-updater

      - name: Sign APKs
        env:
          # The release keystore lives only in the KEYSTORE_BASE64 repository secret,
          # so every build is signed with the same key and installs as an update.
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: anitenshi
        run: |
          set -euo pipefail
          KEYSTORE="${RUNNER_TEMP}/anitenshi.p12"
          printf '%s' "${KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > "${KEYSTORE}"

          BUILD_TOOLS="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)"
          APKSIGNER="${BUILD_TOOLS}/apksigner"
          ZIPALIGN="${BUILD_TOOLS}/zipalign"
          OUT=signed
          mkdir -p "${OUT}"
          for abi in universal arm64-v8a armeabi-v7a; do
            UNSIGNED="app/build/outputs/apk/release/app-${abi}-release-unsigned.apk"
            if ! "${ZIPALIGN}" -c -P 16 4 "${UNSIGNED}" > /dev/null; then
              "${ZIPALIGN}" -f -P 16 4 "${UNSIGNED}" "${RUNNER_TEMP}/aligned.apk"
              mv "${RUNNER_TEMP}/aligned.apk" "${UNSIGNED}"
            fi
            "${APKSIGNER}" sign \
              --ks "${KEYSTORE}" \
              --ks-type PKCS12 \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias anitenshi \
              --out "${OUT}/anitenshi-${abi}.apk" \
              "${UNSIGNED}"
            "${APKSIGNER}" verify "${OUT}/anitenshi-${abi}.apk"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: anitenshi-${{ github.sha }}
          path: signed/*.apk

      # Turns crash logs from the app ("r8-map-id-…" lines) back into the real code lines
      - name: Upload R8 mapping
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: mapping-${{ github.sha }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          IS_TEST: ${{ github.ref != 'refs/heads/master' }}
        run: |
          set -euo pipefail
          # Tag = commit count, the same number the app compares against (BuildConfig.COMMIT_COUNT).
          TAG="r$(git rev-list --count HEAD)"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          # Version name from app/build.gradle.kts (e.g. 1.0.1); the tag stays r<commit count> for the in-app updater
          VERSION_NAME="$(grep -m1 -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"

          PREVIOUS_TAG="$(gh release view --json tagName --jq .tagName 2>/dev/null || true)"
          # Readable notes for this version (Italian), shown by the in-app updater above the "---" line.
          # Used only when its first line names this version, so stale notes never reach a new release.
          NOTES_FILE=".github/release-notes.md"
          {
            if [ -f "${NOTES_FILE}" ] && head -n1 "${NOTES_FILE}" | grep -qF "${VERSION_NAME}"; then
              cat "${NOTES_FILE}"
              echo
              echo "---"
              echo
            fi
            echo "AniTenshi ${VERSION_NAME} (${TAG}), built from ${SHORT_SHA}."
            echo
            if [ -n "${PREVIOUS_TAG}" ] && [ "${PREVIOUS_TAG}" != "${TAG}" ] && git rev-parse -q --verify "refs/tags/${PREVIOUS_TAG}" > /dev/null; then
              echo "### Changes since ${PREVIOUS_TAG}"
              git log --no-merges -n 40 --pretty='- %s' "${PREVIOUS_TAG}..HEAD"
              echo
            fi
            echo "### Download"
            echo "- \`anitenshi-arm64-v8a.apk\`: most phones"
            echo "- \`anitenshi-universal.apk\`: any device, larger download"
            echo "- \`anitenshi-armeabi-v7a.apk\`: older 32-bit phones"
            echo
            echo "### Support AniTenshi"
            echo "[Buy Me a Coffee](https://buymeacoffee.com/anitenshi) · [PayPal](https://paypal.me/Borelli99)"
          } > "${RUNNER_TEMP}/notes.md"

          if [ "${IS_TEST}" = "true" ]; then
            # Private test build: a draft release (no tag is created until it is published).
            # Older test drafts are removed so only the newest one is listed.
            gh api "repos/${{ github.repository }}/releases?per_page=100" \
              --jq '.[] | select(.draft and (.tag_name | startswith("test-"))) | .id' |
              while read -r OLD_ID; do gh api -X DELETE "repos/${{ github.repository }}/releases/${OLD_ID}"; done
            {
              echo "**Build di prova privata** (ramo \`${GITHUB_REF_NAME}\`): la vedi solo tu, l'app non la propone a nessuno."
              echo
              cat "${RUNNER_TEMP}/notes.md"
            } > "${RUNNER_TEMP}/test-notes.md"
            gh release create "test-${SHORT_SHA}" signed/*.apk \
              --draft --prerelease \
              --target "${{ github.sha }}" \
              --title "TEST AniTenshi ${VERSION_NAME} (${SHORT_SHA})" \
              --notes-file "${RUNNER_TEMP}/test-notes.md"
          elif gh release view "${TAG}" > /dev/null 2>&1; then
            gh release upload "${TAG}" signed/*.apk --clobber
          else
            gh release create "${TAG}" signed/*.apk \
              --target "${{ github.sha }}" \
              --title "AniTenshi ${VERSION_NAME} (${TAG})" \
              --notes-file "${RUNNER_TEMP}/notes.md" \
              --latest
          fi
