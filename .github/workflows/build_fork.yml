name: Build AniTenshi APK

# Builds a signed APK of AniTenshi (fork of Animetail) and publishes it as a GitHub release,
# so it can be downloaded straight from the phone (Releases page).
on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and release
    if: github.repository != 'Animetailapp/Animetail'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Clone repo
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Test extension store decoding
        run: ./gradlew :app:testReleaseUnitTest --tests "mihon.data.extension.model.AnimeExtensionStoreDecoderTest"

      - name: Build app
        run: ./gradlew assembleRelease

      - name: Sign APKs
        env:
          # The release keystore lives only in the KEYSTORE_BASE64 repository secret,
          # so every build is signed with the same key and installs as an update.
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: anitenshi
        run: |
          set -euo pipefail
          KEYSTORE="${RUNNER_TEMP}/anitenshi.p12"
          printf '%s' "${KEYSTORE_BASE64}" | tr -d '[:space:]' | base64 --decode > "${KEYSTORE}"

          BUILD_TOOLS="$(ls -d "${ANDROID_HOME}"/build-tools/* | sort -V | tail -n 1)"
          APKSIGNER="${BUILD_TOOLS}/apksigner"
          ZIPALIGN="${BUILD_TOOLS}/zipalign"
          OUT=signed
          mkdir -p "${OUT}"
          for abi in universal arm64-v8a armeabi-v7a; do
            UNSIGNED="app/build/outputs/apk/release/app-${abi}-release-unsigned.apk"
            if ! "${ZIPALIGN}" -c -P 16 4 "${UNSIGNED}" > /dev/null; then
              "${ZIPALIGN}" -f -P 16 4 "${UNSIGNED}" "${RUNNER_TEMP}/aligned.apk"
              mv "${RUNNER_TEMP}/aligned.apk" "${UNSIGNED}"
            fi
            "${APKSIGNER}" sign \
              --ks "${KEYSTORE}" \
              --ks-type PKCS12 \
              --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias anitenshi \
              --out "${OUT}/anitenshi-${abi}.apk" \
              "${UNSIGNED}"
            "${APKSIGNER}" verify "${OUT}/anitenshi-${abi}.apk"
          done

      - name: Upload APKs
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: anitenshi-${{ github.sha }}
          path: signed/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="r${{ github.run_number }}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          gh release create "${TAG}" signed/*.apk \
            --target "${{ github.sha }}" \
            --title "AniTenshi r${{ github.run_number }} (${SHORT_SHA})" \
            --notes "Build automatica di AniTenshi dal commit ${SHORT_SHA}. Per la maggior parte dei telefoni scarica anitenshi-arm64-v8a.apk; se non si installa, usa anitenshi-universal.apk." \
            --latest
