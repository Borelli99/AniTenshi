name: ⭐ Feature request
description: Suggest a feature to improve AniTenshi
labels: [Feature request]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Describe your suggested feature
      description: How can AniTenshi be improved?
      placeholder: |
        Example:
          "It should work like this..."
    validations:
      required: true

  - type: textarea
    id: other-details
    attributes:
      label: Other details
      placeholder: |
        Additional details, examples and attachments.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Read this carefully, incomplete requests will be closed.
      options:
        - label: I have searched the existing issues and this is a new ticket, **NOT** a duplicate or related to another open or closed issue.
          required: true
        - label: I have written a short but informative title.
          required: true
        - label: This is not a request about a single extension (those should go to the extension's maintainers).
          required: true
        - label: I am using the **[latest version of AniTenshi](https://github.com/Borelli99/AniTenshi/releases/latest)**.
          required: true
